{% extends 'app_store/base.html' %}

{% block title %}Login — TechStore{% endblock %}

{% block content %}
<div class="container section">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
    <p style="text-align:center; margin-top:16px;">
        New here? <a href="{% url 'app_accounts:register' %}">Register</a>
    </p>
</div>
{% endblock %}
